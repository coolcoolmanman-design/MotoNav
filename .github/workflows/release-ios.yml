name: Build and publish iOS and universal firmware
on:
  push:
    # Feature branches included so draft night-flash packs can build without workflow_dispatch ACL.
    branches:
      - main
      - ios-v0.15.3
      - ios-v0.15.4
      - ios-v0.16.2.4-liquid
      - ios-v0.16.2.6-visualfix
      - ios-v0.16.2.7
      - cursor/firmware-musica17-sixslot
      - cursor/music-theme-styles-8b90
      - cursor/music-theme-fix-8b90
      - cursor/standby-settings-redesign-95d2
      - cursor/gta6-wallpaper-persist-5343
      - cursor/fullscreen-pointer-redesign-6273
      - cursor/dial-clip-fullscreen-fix-34df
      - cursor/ios-0.16.2.8-trips-glass-3d65
      - cursor/ios-0.16.2.10-trips-dial-9375
      - cursor/ios-0.16.2.5-musica-790c
      - cursor/ios-0.16.2.3-musica-790c
      - cursor/ios-0.16.2.2-musica-790c
      - cursor/ios-0.16.2.1-map-glass-aab6
      - cursor/ios-0.15.40-map-glass-7061
      - cursor/ios-0.15.39-glass-puck-d16b
      - cursor/ios-0.15.38-glass-puck-d16b
      - cursor/ios-0.15.37-glass-puck-d16b
      - cursor/ios-0.15.36-badge-connect-glass-d16b
      - cursor/ios-0.15.35-carousel-c06f
      - cursor/ios-0.15.34-badge-5fc5
      - cursor/ios-0.15.33-frosted-connect-d848
      - cursor/ios-0.15.32-nav-round-ui-7dcf
      - cursor/ios-0.15.31-map-blank-60-15fc
      - cursor/ios-0.15.30-map-blank-60-15fc
      - cursor/ios-0.15.29-map-blank-60-15fc
      - cursor/ios-0.15.28-map-blank-60-15fc
      - cursor/ios-0.15.27-nav-crash-connect-f109
      - cursor/ios-0.15.26-nav-hud-2f25
      - cursor/ios-0.15.25-nav-route-btn-6f02
      - cursor/ios-0.15.24-connect-upright-fb47
      - cursor/ios-0.15.23-map-ui-3206
      - cursor/ios-0.15.22-tpms-ui-fixes-a0b5
      - cursor/ios-0.15.21-tpms-ui-fixes-faef
      - cursor/ios-0.15.20-tpms-ui-fixes-0885
      - cursor/ios-0.15.19-tpms-ui-fixes-b083
      - cursor/ios-0.15.18-ui-fixes-cd56
      - cursor/ios-0.15.17-ia-ui-cd56
      - cursor/ios-0.15.16-tpms-9da6
      - cursor/ios-ui-cool-tech-fe71
      - cursor/ios-sync-fw-opt-c2ef
      - cursor/ios-0.16.2.14-autorotate-790c
      - cursor/musica49-ui1-tdtsat
      - cursor/custom-sprite-battery-mgmt-dfe6
    paths:
      - RELEASE_VERSION
      - docs/RELEASE-IOS-*.md
      - .github/workflows/release-ios.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # retrigger: musicA.46 GTA + wallpaper persist / 0.16.2.41 release notes
  group: motonav-public-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Always build firmware for draft night-flash packs
        id: firmware
        shell: bash
        run: echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Verify arrival lifecycle and callback sessions
        run: |
          swiftc ios/MotoNav/ArrivalPolicy.swift ios/tests/arrival/main.swift -o /tmp/arrival
          /tmp/arrival
          swiftc ios/MotoNav/ArrivalPolicy.swift ios/MotoNav/NaviSessionCallbacks.swift ios/tests/arrival-relay/SDKStubs.swift ios/tests/arrival-relay/main.swift -o /tmp/arrival-relay
          /tmp/arrival-relay
      - name: Install locked iOS dependencies
        working-directory: ios
        run: |
          # retrigger: musicA.21 auto-home-on-arrival+wallpaper-in-settings+live-g
          sudo gem install cocoapods -v 1.17.0 --no-document
          # AMap CDN (a.amap.com) occasionally times out on GitHub runners — retry a few times.
          for i in 1 2 3 4 5; do
            if pod _1.17.0_ install --deployment; then
              exit 0
            fi
            echo "pod install failed (attempt $i); sleeping before retry…"
            sleep $((i * 20))
          done
          exit 1
      - name: Build unsigned iPhone IPA
        run: |
          set -o pipefail
          if ! ./scripts/build-ios-ipa.sh 2>&1 | tee /tmp/xcbuild.log; then
            grep -E "error:" /tmp/xcbuild.log | sort -u | head -15 | while IFS= read -r l; do echo "::error::${l:0:380}"; done
            exit 1
          fi
      - name: Verify iOS data and BLE behavior
        run: |
          swiftc -O ios/MotoNav/MapGeo.swift ios/MotoNav/RasterProcessing.swift ios/MotoNav/RouteMapPlan.swift ios/tests/maps/main.swift -o /tmp/maps
          /tmp/maps
          swiftc ios/MotoNav/BleBulkWriteQueue.swift ios/MotoNav/BleWritePacer.swift ios/tests/ble-bulk/main.swift -o /tmp/bulk
          /tmp/bulk
          swiftc ios/MotoNav/BleWritePacer.swift ios/tests/ble-pacing/main.swift -o /tmp/pacing
          /tmp/pacing
          swiftc ios/MotoNav/CoverPacket.swift ios/tests/cover/main.swift -o /tmp/cover
          /tmp/cover
          swiftc ios/MotoNav/BadgePacket.swift ios/tests/badge/main.swift -o /tmp/badge
          /tmp/badge
          python3 -m unittest discover -s firmware/tests -p 'test_*.py'
      # Skip Espressif CDN on night-flash when firmware-v* Draft already exists (504s on mkspiffs etc).
      # Prefer downloading published FW bins so IPA Draft can publish without arduino-cli.
      - name: Bundle firmware from existing Draft (skip Arduino CDN)
        id: fw_bundle
        if: steps.firmware.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FW=$(tr -d '[:space:]' < firmware/RELEASE_VERSION)
          TAG="firmware-v${FW}"
          mkdir -p firmware/dist/175/panel0
          if gh release download "$TAG" -D firmware/dist/175/panel0 -p '*panel0*' --clobber; then
            echo "source=draft" >> "$GITHUB_OUTPUT"
            ls -la firmware/dist/175/panel0
            test -f "firmware/dist/175/panel0/MotoNav_universal_1.75_v${FW}_panel0_app_0x10000.bin"
            exit 0
          fi
          echo "Firmware Draft ${TAG} missing — will try local arduino build as last resort"
          echo "source=missing" >> "$GITHUB_OUTPUT"
          exit 1
        continue-on-error: true
      - name: Install ESP32 build tools (last resort only)
        id: esp_tools
        if: steps.firmware.outputs.changed == 'true' && steps.fw_bundle.outcome != 'success'
        continue-on-error: true
        run: |
          brew install arduino-cli
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          # Single attempt only — do not block ios Draft on Espressif CDN.
          arduino-cli core install esp32:esp32@3.3.10
      - name: Build universal round-screen firmware (last resort)
        id: fw_build
        if: steps.firmware.outputs.changed == 'true' && steps.fw_bundle.outcome != 'success' && steps.esp_tools.outcome == 'success'
        continue-on-error: true
        run: python3 firmware/build.py
      - name: Package source, firmware and instructions
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < RELEASE_VERSION)
          FW=$(tr -d '[:space:]' < firmware/RELEASE_VERSION)
          test -f "output/ios/MotoNav-${VERSION}-unsigned.ipa"
          git archive --format=zip --prefix=MotoNav/ HEAD > "output/ios/MotoNav-${VERSION}-source.zip"
          cp docs/INSTALL-IOS.md output/ios/INSTALL-IOS.md
          cp firmware/README.md output/ios/FIRMWARE.md
          cp "docs/RELEASE-IOS-${VERSION}.md" output/ios/RELEASE-NOTES.md
          echo "Bundled firmware ${FW}" >> output/ios/FIRMWARE.md
          if [ -d firmware/dist/175/panel0 ] && ls firmware/dist/175/panel0/* >/dev/null 2>&1; then
            zip -qr "output/ios/MotoNav-universal-firmware-7.12.0.zip" firmware/dist/175/panel0
            echo "Firmware zip included from dist/panel0" >> output/ios/FIRMWARE.md
          else
            echo "Firmware bins unavailable in this pack (iOS-only Draft). Use firmware-v${FW} Draft for flashing." >> output/ios/FIRMWARE.md
            echo "::warning::Publishing iOS-only Draft without firmware zip"
          fi
          cd output/ios
          shasum -a 256 *.ipa *.zip *.md > SHA256SUMS.txt
      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: motonav-public-release
          path: output/ios/
      - name: Publish GitHub Draft Release (stay draft)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < RELEASE_VERSION)
          FW=$(tr -d '[:space:]' < firmware/RELEASE_VERSION)
          TAG="ios-v${VERSION}"
          # Create as draft and NEVER undraft — night-flash / self-test only.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes || true
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "MotoNav iOS ${VERSION} · 通用圆屏 ${FW}" \
            --notes-file "docs/RELEASE-IOS-${VERSION}.md" --draft
          gh release upload "$TAG" output/ios/*.ipa output/ios/*.zip output/ios/*.md output/ios/SHA256SUMS.txt
          # Reaffirm draft in case a future edit flips it.
          gh release edit "$TAG" --draft
          gh release view "$TAG" --json isDraft,tagName,name,url
