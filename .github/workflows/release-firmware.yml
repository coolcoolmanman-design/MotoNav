name: Verify and publish universal firmware
# infograph-07 musicA.62 FO-209 Infograph touch freeze
# FO-185: musicA.53 — GitHub-pin arduino-cli + cache/retry ESP32 core (CDN 504)
on:
  push:
    branches: [main, firmware-v7.12.9-ui.3, cursor/firmware-zelda40.9-musica-790c, cursor/firmware-zelda40.9-musica2-790c, cursor/firmware-zelda40.9-musica3-790c, cursor/firmware-zelda40.9-musica4-790c, cursor/firmware-musica10-map-vinyl-e895, cursor/firmware-musica12-arriv-ok-6a1d, cursor/firmware-musica13-ok-hit-6a1d, cursor/ios-0.16.2.14-autorotate-790c, cursor/firmware-musica17-sixslot, cursor/music-theme-styles-8b90, cursor/music-theme-fix-8b90, cursor/standby-settings-redesign-95d2, cursor/fullscreen-pointer-redesign-6273, cursor/dial-clip-fullscreen-fix-34df, cursor/time-wipe-b-circles-4f7b, cursor/b-circles-outward-garbled-edc4, cursor/b-circle-label-size-1fb0, cursor/gta6-wallpaper-persist-5343, cursor/musica47-gta-inflate-stack-6789, cursor/musica48-gta-anim-polish-1c96, cursor/musica49-field-fixes-b88c, cursor/musica49-ui1-tdtsat, cursor/custom-sprite-battery-mgmt-dfe6, cursor/vector-hero-map, cursor/combo-sprite-preset-a9e2, cursor/fix4-clock-vectorsprite, cursor/infograph-07-dial-28a6]
    paths:
      - firmware/RELEASE_VERSION
      - firmware/tests/**
      - .github/workflows/release-firmware.yml
      - scripts/release-firmware.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motonav-firmware-release
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_payload: ${{ steps.payload.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect a version-matched binary payload
        id: payload
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < firmware/RELEASE_VERSION)
          if [ -f "firmware/releases/$VERSION/manifest.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Source-only firmware update: tests run, binary publishing skipped."
          fi
      - name: Test media, rotation, idle shutdown and flashing rules
        shell: bash
        run: |
          set -euo pipefail
          for test in firmware/tests/*Test.cpp; do
            g++ -std=c++17 "$test" -o /tmp/motonav-test
            /tmp/motonav-test
          done
          cc firmware/tests/idle-power-off-test.c -o /tmp/motonav-idle
          /tmp/motonav-idle
          python3 -m unittest discover -s firmware/tests -p 'test_flash_macos.py'
  release:
    if: needs.tests.outputs.has_payload == 'true'
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original package and publish firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release-firmware.py
  build:
    # 源码构建发布（无预编译 payload 时走这条路径，v7.12.9-ui.3 起）
    if: needs.tests.outputs.has_payload == 'false'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Arduino ESP32 core (softens Espressif CDN 504)
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
          key: arduino-esp32-3.3.10-${{ runner.os }}-v1
          restore-keys: |
            arduino-esp32-3.3.10-${{ runner.os }}-
      - name: Install Arduino CLI and ESP32 core 3.3.10
        run: |
          set -euo pipefail
          # Prefer GitHub release tarball — downloads.arduino.cc install.sh failed hard
          # on FO-185 run 42584214817 ("Failed to install arduino-cli") before core install.
          CLI_VER=1.5.1
          CLI_TGZ="arduino-cli_${CLI_VER}_Linux_64bit.tar.gz"
          CLI_URL="https://github.com/arduino/arduino-cli/releases/download/v${CLI_VER}/${CLI_TGZ}"
          attempt=1
          max_attempts=5
          while true; do
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 180 \
                 -o "/tmp/${CLI_TGZ}" "$CLI_URL"; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "arduino-cli download failed after $max_attempts attempts"
              exit 1
            fi
            sleep_s=$((attempt * 20))
            echo "arduino-cli download failed (attempt $attempt/$max_attempts); sleeping ${sleep_s}s…"
            attempt=$((attempt + 1))
            sleep "$sleep_s"
          done
          tar -xzf "/tmp/${CLI_TGZ}" -C /usr/local/bin arduino-cli
          chmod +x /usr/local/bin/arduino-cli
          arduino-cli version
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          # Espressif CDN intermittently 504s mid-tool download (e.g. xtensa-esp-elf-gdb).
          attempt=1
          max_attempts=5
          while true; do
            if arduino-cli core install esp32:esp32@3.3.10; then
              echo "ESP32 core 3.3.10 installed (attempt $attempt)"
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "ESP32 core install failed after $max_attempts attempts (likely Espressif CDN 504)"
              exit 1
            fi
            sleep_s=$((attempt * 30))
            echo "core install failed (attempt $attempt/$max_attempts); sleeping ${sleep_s}s before retry…"
            attempt=$((attempt + 1))
            sleep "$sleep_s"
          done
          arduino-cli core list | grep -F 'esp32:esp32' || true
      - name: Build universal 1.75 firmware from source
        run: python3 firmware/build.py
      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(tr -d '\r\n' < firmware/RELEASE_VERSION)
          TAG="firmware-v${VERSION}"
          NOTES="firmware/releases/notes-${VERSION}.md"
          test -f firmware/dist/175/panel0/*_manifest.json
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "MotoNav universal firmware ${VERSION}" --notes-file "$NOTES" --draft
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "MotoNav universal firmware ${VERSION}" --notes "Universal 1.75 round-panel firmware built from source in CI. App image at 0x10000, full image at 0x0. Verify SHA256SUMS before flashing." --draft
          fi
          gh release upload "$TAG" firmware/dist/175/panel0/*
          # Stay draft — night-flash / self-test only (prefs). # retrigger: musicA.21 auto-home-on-arrival+wallpaper-in-settings+live-g
          gh release edit "$TAG" --draft=true
